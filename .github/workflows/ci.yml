# Checks only. This workflow never deploys or publishes anything:
# GitHub Pages deploys stay in deploy.yml, which runs on push to main only.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Install, typecheck, build, test, headless boot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Install Playwright and headless Chromium (CI only, not a repo dependency)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.59.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps --only-shell chromium
      - name: Headless boot smoke (fails on console or page errors)
        env:
          PLAYWRIGHT_PREFIX: ${{ runner.temp }}/pw
        run: node scripts/ci-smoke.mjs dist --selector=canvas
